<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="DejaVu Sans, Liberation Sans, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="36" fill="#F7F9FC"/>
<text x="600.0" y="70" font-size="40" fill="#1565C0" text-anchor="middle" font-weight="bold" >Puissance et énergie : E = P × t</text>
<rect x="80" y="130" width="480" height="260" rx="24" fill="white" stroke="#1565C0" stroke-width="6"/>
<text x="320" y="190" font-size="32" fill="#1565C0" text-anchor="middle" font-weight="bold" >Puissance P</text>
<text x="320" y="240" font-size="26" fill="#78909C" text-anchor="middle" font-weight="normal" >en watts (W)</text>
<text x="320" y="300" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="normal" >ce que l'appareil consomme</text>
<text x="320" y="335" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="normal" >à un instant donné</text>
<rect x="640" y="130" width="480" height="260" rx="24" fill="white" stroke="#43A047" stroke-width="6"/>
<text x="880" y="190" font-size="32" fill="#43A047" text-anchor="middle" font-weight="bold" >Énergie E</text>
<text x="880" y="240" font-size="26" fill="#78909C" text-anchor="middle" font-weight="normal" >en kilowattheures (kWh)</text>
<text x="880" y="300" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="normal" >puissance × durée</text>
<text x="880" y="335" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="normal" >ce que mesure le compteur</text>
<rect x="80" y="430" width="1040" height="260" rx="24" fill="white" stroke="#FFB300" stroke-width="6"/>
<text x="600.0" y="490" font-size="26" fill="#78909C" text-anchor="middle" font-weight="normal" >Exemple</text>
<text x="600.0" y="545" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="bold" >Radiateur 2 000 W pendant 3 heures</text>
<text x="600.0" y="600" font-size="40" fill="#FFB300" text-anchor="middle" font-weight="bold" >E = 2 kW × 3 h = 6 kWh</text>
<text x="600.0" y="655" font-size="24" fill="#78909C" text-anchor="middle" font-weight="normal" >1 kWh = un appareil de 1 000 W pendant 1 heure</text>

</svg>