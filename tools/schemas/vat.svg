<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="DejaVu Sans, Liberation Sans, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="36" fill="#F7F9FC"/>
<text x="600.0" y="70" font-size="40" fill="#1565C0" text-anchor="middle" font-weight="bold" >Le VAT : tester, vérifier, retester</text>
<rect x="80" y="150" width="320" height="300" rx="24" fill="white" stroke="#43A047" stroke-width="6"/>
<circle cx="240" cy="220" r="40" fill="#43A047" stroke="#43A047" stroke-width="5"/>
<text x="240" y="236" font-size="40" fill="white" text-anchor="middle" font-weight="bold" >1</text>
<text x="240" y="310" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="bold" >Tester le VAT</text>
<text x="240" y="355" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >sur une source</text>
<text x="240" y="387" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >sous tension connue</text>
<line x1="410" y1="300" x2="430" y2="300" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
<polygon points="430,300 410.7,310.5 410.7,289.5" fill="#78909C"/>
<rect x="440" y="150" width="320" height="300" rx="24" fill="white" stroke="#1565C0" stroke-width="6"/>
<circle cx="600" cy="220" r="40" fill="#1565C0" stroke="#1565C0" stroke-width="5"/>
<text x="600" y="236" font-size="40" fill="white" text-anchor="middle" font-weight="bold" >2</text>
<text x="600" y="310" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="bold" >Vérifier l'ouvrage</text>
<text x="600" y="355" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >phase-neutre</text>
<text x="600" y="387" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >phase-phase</text>
<text x="600" y="419" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >chaque conducteur-terre</text>
<line x1="770" y1="300" x2="790" y2="300" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
<polygon points="790,300 770.7,310.5 770.7,289.5" fill="#78909C"/>
<rect x="800" y="150" width="320" height="300" rx="24" fill="white" stroke="#43A047" stroke-width="6"/>
<circle cx="960" cy="220" r="40" fill="#43A047" stroke="#43A047" stroke-width="5"/>
<text x="960" y="236" font-size="40" fill="white" text-anchor="middle" font-weight="bold" >3</text>
<text x="960" y="310" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="bold" >Retester le VAT</text>
<text x="960" y="355" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >sur la même</text>
<text x="960" y="387" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >source connue</text>
<rect x="80" y="500" width="1040" height="190" rx="20" fill="white" stroke="#E53935" stroke-width="4"/>
<text x="600.0" y="550" font-size="26" fill="#1F2933" text-anchor="middle" font-weight="normal" >Pourquoi retester ? Un VAT en panne afficherait « pas de tension » à tort.</text>
<text x="600.0" y="600" font-size="26" fill="#1F2933" text-anchor="middle" font-weight="normal" >Un multimètre ne remplace pas un VAT (calibre, pile, cordon…).</text>
<text x="600.0" y="655" font-size="28" fill="#E53935" text-anchor="middle" font-weight="bold" >Obligatoire avant tout travail hors tension (NF C 18-510)</text>

</svg>