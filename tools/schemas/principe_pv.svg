<circle cx="380" cy="537" r="12" fill="#FFB300" stroke="#FFB300" stroke-width="5"/>
<text x="420" y="545" font-size="30" fill="#1F2933" text-anchor="start" font-weight="bold" >Micro-onduleurs</text>
<text x="420" y="585" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >un par panneau</text>

