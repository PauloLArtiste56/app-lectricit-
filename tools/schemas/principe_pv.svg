<circle cx="190" cy="330" r="110" fill="#FFB300" stroke="#FFB300" stroke-width="5"/>
<text x="190" y="355.92" font-size="72" fill="white" text-anchor="middle" font-weight="bold" >Wc</text>
<circle cx="380" cy="192" r="12" fill="#FFB300" stroke="#FFB300" stroke-width="5"/>
<text x="420" y="200" font-size="30" fill="#1F2933" text-anchor="start" font-weight="bold" >Lumière → courant continu</text>
<text x="420" y="240" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >panneau ≈ 400 Wc</text>
