<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="DejaVu Sans, Liberation Sans, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="36" fill="#F7F9FC"/>
<text x="600.0" y="70" font-size="40" fill="#1565C0" text-anchor="middle" font-weight="bold" >Sections de câbles et calibres (NF C 15-100)</text>
<text x="90" y="150" font-size="24" fill="#78909C" text-anchor="start" font-weight="bold" >Usage</text>
<text x="560" y="150" font-size="24" fill="#78909C" text-anchor="middle" font-weight="bold" >Section</text>
<text x="760" y="150" font-size="24" fill="#78909C" text-anchor="middle" font-weight="bold" >Disjoncteur</text>
<text x="960" y="150" font-size="24" fill="#78909C" text-anchor="middle" font-weight="bold" >Limite</text>
<rect x="80" y="170" width="1040" height="90" rx="14" fill="white" stroke="#CFD8DC" stroke-width="3"/>
<text x="90" y="220" font-size="26" fill="#1F2933" text-anchor="start" font-weight="bold" >Éclairage</text>
<circle cx="520" cy="210" r="12.0" fill="#1565C0" stroke="#1565C0" stroke-width="5"/>
<text x="560" y="220" font-size="26" fill="#1565C0" text-anchor="start" font-weight="bold" >1,5 mm²</text>
<text x="760" y="220" font-size="28" fill="#1F2933" text-anchor="middle" font-weight="bold" >16 A</text>
<text x="960" y="220" font-size="24" fill="#78909C" text-anchor="middle" font-weight="normal" >8 points max</text>
<rect x="80" y="280" width="1040" height="90" rx="14" fill="white" stroke="#CFD8DC" stroke-width="3"/>
<text x="90" y="330" font-size="26" fill="#1F2933" text-anchor="start" font-weight="bold" >Prises</text>
<circle cx="520" cy="320" r="16.0" fill="#43A047" stroke="#43A047" stroke-width="5"/>
<text x="560" y="330" font-size="26" fill="#43A047" text-anchor="start" font-weight="bold" >2,5 mm²</text>
<text x="760" y="330" font-size="28" fill="#1F2933" text-anchor="middle" font-weight="bold" >20 A</text>
<text x="960" y="330" font-size="24" fill="#78909C" text-anchor="middle" font-weight="normal" >12 prises max</text>
<rect x="80" y="390" width="1040" height="90" rx="14" fill="white" stroke="#CFD8DC" stroke-width="3"/>
<text x="90" y="440" font-size="26" fill="#1F2933" text-anchor="start" font-weight="bold" >Spécialisé (lave-linge, four)</text>
<circle cx="520" cy="430" r="16.0" fill="#FFB300" stroke="#FFB300" stroke-width="5"/>
<text x="560" y="440" font-size="26" fill="#FFB300" text-anchor="start" font-weight="bold" >2,5 mm²</text>
<text x="760" y="440" font-size="28" fill="#1F2933" text-anchor="middle" font-weight="bold" >20 A</text>
<text x="960" y="440" font-size="24" fill="#78909C" text-anchor="middle" font-weight="normal" >1 prise par circuit</text>
<rect x="80" y="500" width="1040" height="90" rx="14" fill="white" stroke="#CFD8DC" stroke-width="3"/>
<text x="90" y="550" font-size="26" fill="#1F2933" text-anchor="start" font-weight="bold" >Plaque de cuisson</text>
<circle cx="520" cy="540" r="30" fill="#E53935" stroke="#E53935" stroke-width="5"/>
<text x="560" y="550" font-size="26" fill="#E53935" text-anchor="start" font-weight="bold" >6 mm²</text>
<text x="760" y="550" font-size="28" fill="#1F2933" text-anchor="middle" font-weight="bold" >32 A</text>
<text x="960" y="550" font-size="24" fill="#78909C" text-anchor="middle" font-weight="normal" >circuit dédié</text>
<rect x="80" y="650" width="1040" height="70" rx="16" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/>
<text x="600.0" y="694" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="normal" >Le disjoncteur protège le câble : trop gros pour le câble, c'est un risque d'incendie.</text>

</svg>