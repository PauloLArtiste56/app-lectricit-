<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="DejaVu Sans, Liberation Sans, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="36" fill="#F7F9FC"/>
<text x="600.0" y="70" font-size="40" fill="#1565C0" text-anchor="middle" font-weight="bold" >Du vent à l'électricité</text>
<circle cx="190" cy="330" r="110" fill="#1565C0" stroke="#1565C0" stroke-width="5"/>
<text x="190" y="350.16" font-size="56" fill="white" text-anchor="middle" font-weight="bold" >m/s</text>
<circle cx="380" cy="192" r="12" fill="#1565C0" stroke="#1565C0" stroke-width="5"/>
<text x="420" y="200" font-size="30" fill="#1F2933" text-anchor="start" font-weight="bold" >Puissance ∝ vitesse³</text>
<text x="420" y="240" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >2 × vent = 8 × puissance</text>
<circle cx="380" cy="307" r="12" fill="#1565C0" stroke="#1565C0" stroke-width="5"/>
<text x="420" y="315" font-size="30" fill="#1F2933" text-anchor="start" font-weight="bold" >3 m/s → 12 m/s → 25 m/s</text>
<text x="420" y="355" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >démarrage, nominal, arrêt</text>
<circle cx="380" cy="422" r="12" fill="#1565C0" stroke="#1565C0" stroke-width="5"/>
<text x="420" y="430" font-size="30" fill="#1F2933" text-anchor="start" font-weight="bold" >2 à 6 MW à terre</text>
<text x="420" y="470" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >15 MW en mer</text>
<circle cx="380" cy="537" r="12" fill="#1565C0" stroke="#1565C0" stroke-width="5"/>
<text x="420" y="545" font-size="30" fill="#1F2933" text-anchor="start" font-weight="bold" >Facteur de charge</text>
<text x="420" y="585" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >25 % terre, 40 % mer</text>

</svg>