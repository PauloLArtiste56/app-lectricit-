<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="DejaVu Sans, Liberation Sans, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="36" fill="#F7F9FC"/>
<text x="600.0" y="70" font-size="40" fill="#1565C0" text-anchor="middle" font-weight="bold" >Le code couleur des conducteurs</text>
<text x="80" y="186" font-size="34" fill="#1F2933" text-anchor="start" font-weight="bold" >Phase (L)</text>
<rect x="360.0" y="148" width="132.0" height="44" rx="22" fill="#C62828"/>
<rect x="500.0" y="148" width="132.0" height="44" rx="22" fill="#6D4C41"/>
<rect x="640.0" y="148" width="132.0" height="44" rx="22" fill="#212121"/>
<text x="830" y="166" font-size="26" fill="#1F2933" text-anchor="start" font-weight="bold" >rouge, marron ou noir</text>
<text x="830" y="204" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >amène le courant</text>
<text x="80" y="356" font-size="34" fill="#1F2933" text-anchor="start" font-weight="bold" >Neutre (N)</text>
<rect x="360.0" y="318" width="412.0" height="44" rx="22" fill="#42A5F5"/>
<text x="830" y="336" font-size="26" fill="#1F2933" text-anchor="start" font-weight="bold" >bleu clair</text>
<text x="830" y="374" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >retour du courant</text>
<text x="80" y="526" font-size="34" fill="#1F2933" text-anchor="start" font-weight="bold" >Terre (PE)</text>
<rect x="360" y="488" width="420" height="44" rx="22" fill="#43A047"/>
<rect x="402" y="488" width="42" height="44" fill="#FDD835"/>
<rect x="486" y="488" width="42" height="44" fill="#FDD835"/>
