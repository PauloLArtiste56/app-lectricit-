<rect x="738" y="488" width="42" height="44" fill="#FDD835"/>
<rect x="360" y="488" width="420" height="44" rx="22" fill="none" stroke="#37474F" stroke-width="3"/>
<text x="830" y="506" font-size="26" fill="#1F2933" text-anchor="start" font-weight="bold" >vert et jaune</text>
<text x="830" y="544" font-size="24" fill="#78909C" text-anchor="start" font-weight="normal" >sécurité : jamais autre chose</text>
<rect x="80" y="626" width="1040" height="96" rx="16" fill="#FFF8E1" stroke="#FFB300" stroke-width="4"/>
<text x="600.0" y="666" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="bold" >Ancienne installation ? Les couleurs ne sont pas toujours fiables.</text>
<text x="600.0" y="702" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="normal" >On vérifie toujours avec un appareil de mesure.</text>

