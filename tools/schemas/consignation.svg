<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="DejaVu Sans, Liberation Sans, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="36" fill="#F7F9FC"/>
<text x="600.0" y="70" font-size="40" fill="#1565C0" text-anchor="middle" font-weight="bold" >La consignation : S-C-I-V</text>
<rect x="80" y="130" width="230" height="330" rx="24" fill="white" stroke="#1565C0" stroke-width="6"/>
<rect x="80" y="130" width="230" height="90" rx="24" fill="#1565C0" stroke="#1565C0" stroke-width="6"/>
<text x="195" y="195" font-size="56" fill="white" text-anchor="middle" font-weight="bold" >S</text>
<text x="195" y="275" font-size="26" fill="#1F2933" text-anchor="middle" font-weight="bold" >Séparation</text>
<text x="195" y="330" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >ouvrir l'appareil</text>
<text x="195" y="360" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >de coupure</text>
<line x1="312" y1="295" x2="348" y2="295" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
<polygon points="348,295 328.7,305.5 328.7,284.5" fill="#78909C"/>
<rect x="350" y="130" width="230" height="330" rx="24" fill="white" stroke="#E53935" stroke-width="6"/>
<rect x="350" y="130" width="230" height="90" rx="24" fill="#E53935" stroke="#E53935" stroke-width="6"/>
<text x="465" y="195" font-size="56" fill="white" text-anchor="middle" font-weight="bold" >C</text>
<text x="465" y="275" font-size="26" fill="#1F2933" text-anchor="middle" font-weight="bold" >Condamnation</text>
<text x="465" y="330" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >cadenas + pancarte</text>
<text x="465" y="360" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >pas de remise sous tension</text>
<line x1="582" y1="295" x2="618" y2="295" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
<polygon points="618,295 598.7,305.5 598.7,284.5" fill="#78909C"/>
<rect x="620" y="130" width="230" height="330" rx="24" fill="white" stroke="#FFB300" stroke-width="6"/>
<rect x="620" y="130" width="230" height="90" rx="24" fill="#FFB300" stroke="#FFB300" stroke-width="6"/>
<text x="735" y="195" font-size="56" fill="white" text-anchor="middle" font-weight="bold" >I</text>
<text x="735" y="275" font-size="26" fill="#1F2933" text-anchor="middle" font-weight="bold" >Identification</text>
<text x="735" y="330" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >être sûr d'être</text>
<text x="735" y="360" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >sur le bon ouvrage</text>
<line x1="852" y1="295" x2="888" y2="295" stroke="#78909C" stroke-width="6" stroke-linecap="round"/>
<polygon points="888,295 868.7,305.5 868.7,284.5" fill="#78909C"/>
<rect x="890" y="130" width="230" height="330" rx="24" fill="white" stroke="#43A047" stroke-width="6"/>
<rect x="890" y="130" width="230" height="90" rx="24" fill="#43A047" stroke="#43A047" stroke-width="6"/>
<text x="1005" y="195" font-size="56" fill="white" text-anchor="middle" font-weight="bold" >V</text>
<text x="1005" y="275" font-size="26" fill="#1F2933" text-anchor="middle" font-weight="bold" >VAT</text>
<text x="1005" y="330" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >absence de tension</text>
<text x="1005" y="360" font-size="19" fill="#78909C" text-anchor="middle" font-weight="normal" >VAT testé avant / après</text>
<rect x="80" y="500" width="1040" height="200" rx="24" fill="white" stroke="#37474F" stroke-width="4"/>
<text x="600.0" y="550" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="normal" >En haute tension, ou s'il y a un risque de réalimentation :</text>
<text x="600.0" y="585" font-size="26" fill="#1F2933" text-anchor="middle" font-weight="bold" >+ mise à la terre et en court-circuit</text>
<text x="600.0" y="640" font-size="24" fill="#78909C" text-anchor="middle" font-weight="normal" >Déconsignation : dans l'ordre inverse</text>
<text x="600.0" y="675" font-size="22" fill="#78909C" text-anchor="middle" font-weight="normal" >EPI : gants isolants, écran facial, tapis et outils isolés</text>

</svg>