<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="DejaVu Sans, Liberation Sans, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="36" fill="#F7F9FC"/>
<text x="600.0" y="70" font-size="40" fill="#1565C0" text-anchor="middle" font-weight="bold" >Montage en série : un seul chemin</text>
<line x1="160" y1="388" x2="240" y2="388" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
<line x1="182" y1="412" x2="218" y2="412" stroke="#37474F" stroke-width="10" stroke-linecap="round"/>
<text x="262" y="392" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="normal" >+</text>
<text x="262" y="426" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="normal" >−</text>
<line x1="200" y1="388" x2="200" y2="200" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
<line x1="200" y1="200" x2="1000" y2="200" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
<line x1="1000" y1="200" x2="1000" y2="600" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
<line x1="1000" y1="600" x2="200" y2="600" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
<line x1="200" y1="600" x2="200" y2="412" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
<rect x="450" y="180" width="100" height="40" rx="8" fill="white" stroke="#37474F" stroke-width="5"/>
<text x="500" y="160" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="normal" >R1</text>
<rect x="700" y="180" width="100" height="40" rx="8" fill="white" stroke="#37474F" stroke-width="5"/>
<text x="750" y="160" font-size="30" fill="#1F2933" text-anchor="middle" font-weight="normal" >R2</text>
<line x1="300" y1="240" x2="400" y2="240" stroke="#FFB300" stroke-width="6" stroke-linecap="round"/>
<polygon points="400,240 380.7,250.5 380.7,229.5" fill="#FFB300"/>
<text x="350" y="285" font-size="34" fill="#FFB300" text-anchor="middle" font-weight="bold" >I</text>
<line x1="850" y1="240" x2="950" y2="240" stroke="#FFB300" stroke-width="6" stroke-linecap="round"/>
<polygon points="950,240 930.7,250.5 930.7,229.5" fill="#FFB300"/>
<text x="900" y="285" font-size="34" fill="#FFB300" text-anchor="middle" font-weight="bold" >I</text>
<text x="500" y="260" font-size="30" fill="#1565C0" text-anchor="middle" font-weight="bold" >U1</text>
<text x="750" y="260" font-size="30" fill="#1565C0" text-anchor="middle" font-weight="bold" >U2</text>
<text x="140" y="420" font-size="34" fill="#1565C0" text-anchor="middle" font-weight="bold" >U</text>
<text x="600" y="360" font-size="32" fill="#FFB300" text-anchor="middle" font-weight="bold" >Même intensité I partout</text>
<text x="600" y="415" font-size="32" fill="#1F2933" text-anchor="middle" font-weight="normal" >U = U1 + U2</text>
<text x="600" y="470" font-size="32" fill="#1F2933" text-anchor="middle" font-weight="normal" >R = R1 + R2</text>
<text x="600" y="525" font-size="32" fill="#1F2933" text-anchor="middle" font-weight="normal" >Un élément coupé → tout s'arrête</text>
<text x="600.0" y="690" font-size="30" fill="#78909C" text-anchor="middle" font-weight="normal" >Exemple : 10 Ω + 20 Ω en série = 30 Ω</text>

</svg>