<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Apprendre l'électricité pas à pas et préparer l'habilitation électrique.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#58CC02">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ElecApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ElecApp</title>
  <link rel="manifest" href="manifest.json">

  <!-- Écran de démarrage : affiché pendant le chargement de Flutter,
       retiré dès que l'appli a dessiné sa première image. -->
  <style>
    html, body { margin: 0; height: 100%; background: #58CC02; }
    #demarrage {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      background: #58CC02; color: #fff; font-family: -apple-system, Roboto, sans-serif;
      transition: opacity .3s ease; z-index: 10;
    }
    #demarrage img { width: 128px; height: 128px; border-radius: 28px;
      box-shadow: 0 8px 0 #46A302; }
    #demarrage h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: .5px; }
    #demarrage .barre { width: 120px; height: 8px; border-radius: 4px;
      background: rgba(255,255,255,.35); overflow: hidden; }
    #demarrage .barre::after { content: ""; display: block; width: 40%; height: 100%;
      background: #fff; border-radius: 4px; animation: glisse 1.1s infinite ease-in-out; }
    @keyframes glisse { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    #demarrage.fin { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="demarrage">
    <img src="icons/Icon-192.png" alt="">
    <h1>ElecApp</h1>
    <div class="barre"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var d = document.getElementById('demarrage');
      d.classList.add('fin');
      setTimeout(function () { d.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
