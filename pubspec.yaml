name: elecapp
description: "Appli d'apprentissage des bases de l'électricité, puis préparation à l'habilitation NF C 18-510."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Contenu pédagogique embarqué (lecture seule) et images des fiches.
  assets:
    - assets/content.json
    - assets/parcours.json
    - assets/images/
    - assets/images/decors/
    - assets/images/questions/
    - assets/sons/
